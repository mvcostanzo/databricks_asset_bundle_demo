[project]
name = "mock_data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faker>=37.5.3",
    "ipykernel>=6.30.1",
    "pip>=25.2",
    "polars>=1.32.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_data"]

[project.scripts]
main = "mock_data.main:main"