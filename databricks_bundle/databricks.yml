# This is a Databricks asset bundle definition for cdc_data_loader.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_bundle
  uuid: f3826ac2-f173-4886-937e-28408899b5b7

artifacts:
  mock_data_wheel:
    type: whl
    path: ./mock_data
    build: "uv build --wheel --package mock_data --out-dir dist"
    
    
include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-04ade744-d5cf.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-04ade744-d5cf.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/mvcostanzo@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/mvcostanzo@gmail.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: mvcostanzo@gmail.com
        level: CAN_MANAGE
