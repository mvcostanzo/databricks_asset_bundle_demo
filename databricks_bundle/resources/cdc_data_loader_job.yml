resources:
  jobs:
    cdc_data_loader_job:
      name: "CDC Data Loader Job"

      trigger:
        periodic:
          interval: 1
          unit: WEEKS

      tasks:
        - task_key: clear_tables
          environment_key: default
          python_wheel_task:
            package_name: clear_tables
            entry_point: main
        - task_key: mock_data
          environment_key: default
          depends_on:
            - task_key: clear_tables
          python_wheel_task:
            package_name: mock_data
            entry_point: main


      # A list of task execution environment specifications that can be referenced by tasks of this job.
      environments:
        - environment_key: default

          # Full documentation of this spec can be found at:
          # https://docs.databricks.com/api/workspace/jobs/create#environments-spec
          spec:
            environment_version: "4"
            dependencies:
              - ../mock_data/dist/*.whl
              - ../clear_tables/dist/*.whl